services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-appsolo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appsolo_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-appsolo_client_hub_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - appsolo_postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  appsolo_postgres_data:
